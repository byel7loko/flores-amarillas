<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <meta name="description" content="Una sorpresa especial con flores amarillas.">
  <title>Una sorpresa para ti 🌼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars" aria-hidden="true"></div>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>

    <section class="intro" id="intro" aria-label="Sorpresa">
      <p class="eyebrow">TENGO ALGO PARA TI</p>
      <h1 id="introTitle">Una pequeña sorpresa 🌼</h1>
      <p id="introText">Entra y mira lo que preparé para ti.</p>
      <button class="open-btn" id="openBtn">Abrir sorpresa</button>
      <p class="hint">Toca el botón para comenzar</p>
    </section>

    <section class="garden" id="garden" aria-hidden="true">
      <div class="moon"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>

      <div class="message-card" id="messageCard">
        <span class="mini-flower">🌼</span>
        <p class="card-kicker">PARA TI</p>
        <h2 id="messageTitle">Flores amarillas para alegrarte el día</h2>
        <p id="messageBody">Que cada flor represente un momento bonito, una sonrisa y un recuerdo que quieras guardar.</p>
        <button class="replay-btn" id="replayBtn">Ver de nuevo</button>
      </div>

      <div class="ground" aria-hidden="true"></div>
      <div class="flowers" id="flowers" aria-hidden="true"></div>
      <div class="petals" id="petals" aria-hidden="true"></div>
      <div class="fireflies" id="fireflies" aria-hidden="true"></div>

      <p class="footer-note" id="footerNote">Hecho especialmente para ti ✨</p>
    </section>
  </main>

  <noscript>Esta página necesita JavaScript para mostrar la animación.</noscript>
  <script src="script.js"></script>
</body>
</html>
